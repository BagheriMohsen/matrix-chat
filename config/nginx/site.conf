# ACME challenge for push.koten.ir
server {
    listen 80;
    server_name push.koten.ir;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}


server {
    listen 80;
    server_name __MATRIX_SERVER_NAME__;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        try_files $uri =404;
    }

    location = /health {
        return 204;
    }

    location / {
        return 301 __PUBLIC_BASE_URL__$request_uri;
    }
}

server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl;
    server_name __MATRIX_SERVER_NAME__;

    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size __MAX_UPLOAD_SIZE_NGINX__;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /.well-known/matrix/client {
        default_type application/json;
        add_header Access-Control-Allow-Origin "__PUBLIC_BASE_URL__" always;
        return 200 '{"m.homeserver":{"base_url":"__PUBLIC_BASE_URL__"}}';
    }

    # Synapse Admin API. Synapse enforces server-admin authorization.
    location ^~ /_synapse/admin/ {
        proxy_pass http://synapse:8008;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_request_buffering off;
        add_header Cache-Control "no-store" always;
    }

    # Prevent clients from publishing rooms in the directory.
    location ~ ^/_matrix/client/[^/]+/directory/list/room/ {
        return 403;
    }

    location ~ ^(/_matrix|/_synapse/client) {
        proxy_pass http://synapse:8008;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
    }

    location = /config.json {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Public Synapse Admin UI.
    location = /panel {
        return 301 /panel/;
    }

    location ^~ /panel/ {
        proxy_pass http://synapse-admin:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Cache-Control "no-store" always;
    }

    # Element Web.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, max-age=604800" always;
    }
}

server {
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    return 444;
}

# Private administration endpoint.
server {
    listen 81;
    server_name _;

    location = /health {
        return 204;
    }

    location ^~ /_synapse/admin/ {
        proxy_pass http://synapse:8008;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^(/_matrix|/_synapse/client) {
        proxy_pass http://synapse:8008;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /panel {
        return 301 /panel/;
    }

    location ^~ /panel/ {
        proxy_pass http://synapse-admin:80/;
        proxy_set_header Host $host;
    }

    location / {
        return 404;
    }
}
