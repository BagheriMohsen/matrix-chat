server {
  listen 80;
  server_name ct.koten.ir;
  location ^~ /.well-known/acme-challenge/ { root /var/www/acme; try_files $uri =404; }
  location / { return 301 https://ct.koten.ir$request_uri; }
}
server { listen 80 default_server; server_name _; return 444; }

server {
  listen 443 ssl;
  server_name ct.koten.ir;
  ssl_certificate /etc/nginx/tls/fullchain.pem;
  ssl_certificate_key /etc/nginx/tls/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;
  client_max_body_size 20m;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  location = /.well-known/matrix/client {
    default_type application/json;
    add_header Access-Control-Allow-Origin "https://ct.koten.ir" always;
    return 200 '{"m.homeserver":{"base_url":"https://ct.koten.ir"}}';
  }
  location ^~ /_synapse/admin/ { return 404; }
  # Server-side edge control: no client may publish a room in the directory.
  location ~ ^/_matrix/client/[^/]+/directory/list/room/ { return 403; }
  location ~ ^(/_matrix|/_synapse/client) {
    proxy_pass http://synapse:8008;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_request_buffering off;
  }
  location = /config.json { add_header Cache-Control "no-store" always; try_files $uri =404; }
  location / { try_files $uri $uri/ /index.html; add_header Cache-Control "public, max-age=604800" always; }
}
server { listen 443 ssl default_server; server_name _; ssl_certificate /etc/nginx/tls/fullchain.pem; ssl_certificate_key /etc/nginx/tls/privkey.pem; return 444; }
