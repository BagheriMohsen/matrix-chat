
server {
  listen 80 default_server;
  server_name __LOCAL_HOST__;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size __MAX_UPLOAD_SIZE_NGINX__;

  location = /health { return 204; }

  location = /.well-known/matrix/client {
    default_type application/json;
    return 200 '{"m.homeserver":{"base_url":"__LOCAL_ELEMENT_URL__"}}';
  }

  location ^~ /_synapse/admin/ { return 404; }
  location ^~ /_matrix/federation/ { return 404; }
  location ~ ^/_matrix/client/[^/]+/directory/list/room/ { return 403; }

  location ~ ^(/_matrix|/_synapse/client) {
    proxy_pass http://synapse:8008;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 600s;
    proxy_request_buffering off;
  }

  location = /config.json {
    alias /etc/nginx/local-element-config.json;
    default_type application/json;
    add_header Cache-Control "no-store" always;
  }

  location = /admin { return 404; }
  location ^~ /admin/ { return 404; }
  location = /analytics { return 404; }
  location ^~ /analytics/ { return 404; }
  location = /panel { return 404; }
  location ^~ /panel/ { return 404; }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

server {
  listen 81 default_server;
  server_name __LOCAL_HOST__;
  client_max_body_size __MAX_UPLOAD_SIZE_NGINX__;

  location = /health { return 204; }

  location = /.well-known/matrix/client {
    default_type application/json;
    return 200 '{"m.homeserver":{"base_url":"__LOCAL_ADMIN_URL__"}}';
  }

  location ^~ /_matrix/federation/ { return 404; }

  location ^~ /_synapse/admin/ {
    proxy_pass http://synapse:8008;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ~ ^/_matrix/client/[^/]+/directory/list/room/ {
    return 403;
  }

  location ~ ^(/_matrix|/_synapse/client) {
    proxy_pass http://synapse:8008;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 600s;
    proxy_request_buffering off;
  }

  location = /panel { return 404; }
  location ^~ /panel/ { return 404; }

  location = /analytics { return 301 /analytics/; }
  location ^~ /analytics/ {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $analytics_upstream analytics:8080;
    proxy_pass http://$analytics_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 30s;
    add_header Cache-Control "no-store" always;
  }

  location = /admin {
    return 301 /admin/;
  }

  location ^~ /admin/ {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $ketesa_upstream ketesa:8080;
    proxy_pass http://$ketesa_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    add_header Cache-Control "no-store" always;
  }

  location / {
    return 404;
  }
}
