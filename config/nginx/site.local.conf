server {
  listen 80 default_server;
  server_name localhost;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 20m;

  location = /health { return 204; }
  location = /.well-known/matrix/client {
    default_type application/json;
    return 200 '{"m.homeserver":{"base_url":"http://localhost:8080"}}';
  }
  location ^~ /_synapse/admin/ { return 404; }
  location ^~ /_matrix/federation/ { return 404; }
  location ~ ^/_matrix/client/[^/]+/directory/list/room/ { return 403; }
  location ~ ^(/_matrix|/_synapse/client) {
    proxy_pass http://synapse:8008;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 600s;
    proxy_request_buffering off;
  }
  location = /config.json {
    alias /etc/nginx/local-element-config.json;
    default_type application/json;
    add_header Cache-Control "no-store" always;
  }
  location / { try_files $uri $uri/ /index.html; }
}

server {
  listen 81 default_server;
  server_name localhost;
  client_max_body_size 20m;

  location = /health { return 204; }
  location = /.well-known/matrix/client {
    default_type application/json;
    return 200 '{"m.homeserver":{"base_url":"http://localhost:8081"}}';
  }
  location ^~ /_matrix/federation/ { return 404; }
  location ^~ /_synapse/admin/ {
    proxy_pass http://synapse:8008;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location ~ ^/_matrix/client/[^/]+/directory/list/room/ { return 403; }
  location ~ ^(/_matrix|/_synapse/client) {
    proxy_pass http://synapse:8008;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 600s;
    proxy_request_buffering off;
  }
  location / { proxy_pass http://synapse-admin:80; }
}
