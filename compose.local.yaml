services:
  postgres:
    extends:
      file: compose.yaml
      service: postgres

  synapse:
    extends:
      file: compose.yaml
      service: synapse
    environment:
      SYNAPSE_CONFIG_PATH: /data/homeserver.local.yaml

  ketesa:
    image: ghcr.io/etkecc/ketesa:v1.5.1-subpath-admin@sha256:315dc260791fb9bccbb1f63ce396c4bd34a47d9ac8027612af93858745d71f95
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      synapse: {condition: service_healthy}
    volumes:
      - ./data/ketesa/config.json:/var/public/admin/config.json:ro
    networks: [backend]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: local
      options: {max-size: "10m", max-file: "3"}

  analytics:
    image: matrixdotorg/synapse:v1.161.0
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      synapse: {condition: service_healthy}
    entrypoint: ["python3", "/opt/analytics/server.py"]
    environment:
      ANALYTICS_BIND: "0.0.0.0"
      ANALYTICS_PORT: "8080"
      ANALYTICS_DATA_DIR: /var/lib/analytics
      ANALYTICS_SESSION_TTL: ${ANALYTICS_SESSION_TTL}
      ANALYTICS_PATH: ${ANALYTICS_PATH}
      SYNAPSE_URL: http://synapse:8008
    user: "${ANALYTICS_UID:-1000}:${ANALYTICS_GID:-1000}"
    volumes:
      - ./src/analytics:/opt/analytics:ro
      - ./data/analytics:/var/lib/analytics
      - /proc:/host/proc:ro
      - /sys/fs/cgroup:/host/sys/fs/cgroup:ro
      - /:/host-root:ro
    networks: [backend]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: local
      options: {max-size: "10m", max-file: "3"}

  nginx:
    image: nginx:1.30.6-alpine3.24-slim
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      synapse: {condition: service_healthy}
      ketesa: {condition: service_healthy}
      analytics: {condition: service_healthy}
    ports:
      - "127.0.0.1:${LOCAL_ELEMENT_PORT}:80"
      - "127.0.0.1:${LOCAL_ADMIN_PORT}:81"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./data/nginx/site.local.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/element/config.local.json:/etc/nginx/local-element-config.json:ro
      - ./data/element:/usr/share/nginx/html:ro
    networks: [frontend, backend]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: local
      options: {max-size: "10m", max-file: "3"}

networks:
  frontend: {}
  backend:
    internal: true
