services:
  postgres:
    extends:
      file: compose.yaml
      service: postgres

  synapse:
    extends:
      file: compose.yaml
      service: synapse
    environment:
      SYNAPSE_CONFIG_PATH: /data/homeserver.local.yaml

  synapse-admin:
    image: awesometechnologies/synapse-admin:0.11.4
    platform: linux/amd64
    restart: unless-stopped
    volumes:
      - ./data/admin/config.json:/app/config.json:ro
    networks: [frontend]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/config.json"]
      interval: 20s
      timeout: 5s
      retries: 6
    logging:
      driver: local
      options: {max-size: "10m", max-file: "3"}

  nginx:
    image: nginx:1.30.6-alpine3.24-slim
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      synapse: {condition: service_healthy}
      synapse-admin: {condition: service_healthy}
    ports:
      - "127.0.0.1:${LOCAL_ELEMENT_PORT}:80"
      - "127.0.0.1:${LOCAL_ADMIN_PORT}:81"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./data/nginx/site.local.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/element/config.local.json:/etc/nginx/local-element-config.json:ro
      - ./data/element:/usr/share/nginx/html:ro
    networks: [frontend, backend]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: local
      options: {max-size: "10m", max-file: "3"}

networks:
  frontend: {}
  backend:
    internal: true
