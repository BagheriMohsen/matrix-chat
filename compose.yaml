
services:
  postgres:
    image: postgres:17.11-alpine3.24
    platform: linux/amd64
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "work_mem=4MB", "-c", "maintenance_work_mem=64MB", "-c", "max_connections=30"]
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 6
    logging:
      driver: local
      options: {max-size: "10m", max-file: "3"}

  synapse:
    image: matrixdotorg/synapse:v1.161.0
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      SYNAPSE_CONFIG_PATH: /data/homeserver.yaml
      SYNAPSE_NO_TLS: "true"
    volumes:
      - ./data/synapse:/data
    # Backend retains database isolation; frontend supplies the default route
    # needed for public HTTPS push delivery. Recreate Synapse after changing it.
    networks: [frontend, backend]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8008/_matrix/client/versions', timeout=3)\""]
      interval: 20s
      timeout: 5s
      retries: 6
    logging:
      driver: local
      options: {max-size: "10m", max-file: "3"}

  # Optional administration UI. It has no published port; Nginx exposes it
  # only through its existing loopback listener at /admin/.
  ketesa:
    # Official Ketesa /admin build, pinned to the v1.5.1 OCI index.
    image: ghcr.io/etkecc/ketesa:v1.5.1-subpath-admin@sha256:315dc260791fb9bccbb1f63ce396c4bd34a47d9ac8027612af93858745d71f95
    platform: linux/amd64
    profiles: [admin]
    restart: unless-stopped
    depends_on:
      synapse:
        condition: service_healthy
    volumes:
      - ./data/ketesa/config.json:/var/public/admin/config.json:ro
    networks: [backend]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: local
      options: {max-size: "10m", max-file: "3"}

  analytics:
    image: matrixdotorg/synapse:v1.161.0
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      synapse:
        condition: service_healthy
    entrypoint: ["python3", "/opt/analytics/server.py"]
    environment:
      ANALYTICS_BIND: "0.0.0.0"
      ANALYTICS_PORT: "8080"
      ANALYTICS_DATA_DIR: /var/lib/analytics
      ANALYTICS_SESSION_TTL: ${ANALYTICS_SESSION_TTL}
      ANALYTICS_PATH: ${ANALYTICS_PATH}
      SYNAPSE_URL: http://synapse:8008
    user: "${ANALYTICS_UID:-1000}:${ANALYTICS_GID:-1000}"
    volumes:
      - ./src/analytics:/opt/analytics:ro
      - ./data/analytics:/var/lib/analytics
      - /proc:/host/proc:ro
      - /sys/fs/cgroup:/host/sys/fs/cgroup:ro
      - /:/host-root:ro
    networks: [backend]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: local
      options: {max-size: "10m", max-file: "3"}

  nginx:
    image: nginx:1.30.6-alpine3.24-slim
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      synapse:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:8081:81"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./data/nginx/site.conf:/etc/nginx/conf.d/site.conf:ro
      - ./data/element:/usr/share/nginx/html:ro
      - ./data/acme:/var/www/acme:ro
      - ./secrets/tls:/etc/nginx/tls:ro
      - ./secrets/push-tls:/etc/nginx/push-tls:ro
    networks: [frontend, backend]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --header 'Host: ${MATRIX_SERVER_NAME}' http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: local
      options: {max-size: "10m", max-file: "3"}

  ntfy:
    image: binwiederhier/ntfy:v2.14.0
    platform: linux/amd64
    restart: unless-stopped
    command: serve
    environment:
      NTFY_BASE_URL: https://${PUSH_DOMAIN}
      NTFY_LISTEN_HTTP: ":80"
      NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
      NTFY_BEHIND_PROXY: "true"
      NTFY_ENABLE_LOGIN: "false"
    volumes:
      - ./data/ntfy:/var/cache/ntfy
    networks: [backend]
    mem_limit: 128m
    logging:
      driver: local
      options: {max-size: "10m", max-file: "3"}

  coturn:
    image: coturn/coturn:4.6.3-r3
    platform: linux/amd64
    profiles: [calls]
    restart: unless-stopped
    network_mode: host
    command: ["-c", "/etc/coturn/turnserver.conf"]
    volumes:
      - ./data/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
      - ./secrets/tls:/etc/coturn/tls:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: "0.50"
    healthcheck:
      test: ["CMD-SHELL", "pidof turnserver >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 3
    logging:
      driver: local
      options: {max-size: "10m", max-file: "3"}

networks:
  frontend: {}
  backend:
    internal: true
